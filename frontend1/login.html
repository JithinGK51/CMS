<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin / Staff Login - CMS</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/public.css">
</head>

<body class="public-page">
  <header class="public-header">
    <div class="logo-area">
      <div class="logo-icon">🏛</div>
      <span class="logo-text">Public Complaint Management System</span>
    </div>
  </header>

  <main class="hero">
    <div class="form-card" style="max-width:400px;width:100%">
      <div style="text-align:center;margin-bottom:24px">🛡 Admin / Staff Login</div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="input" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div style="position:relative">
            <input type="password" name="password" id="pwInput" class="input" placeholder="Enter your password"
              required>
            <button type="button" id="togglePw"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:14px">LOGIN</button>
      </form>

      <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:0.9rem">
        <a href="#" id="forgotLink" style="color:var(--text-muted)">Forgot Password?</a>
        <a href="index.html" style="color:var(--primary-light)">Back to Home ›</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span> SafeCity </span><span> CivicWorks </span><span> QuickFix </span><span> GovSolve </span>
  </footer>

  <script src="assets/js/api.js"></script>
  <script>
    document.getElementById('togglePw').onclick = () => {
      const i = document.getElementById('pwInput');
      i.type = i.type === 'password' ? 'text' : 'password';
    };

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const data = await api.post('/auth/login', {
        email: form.email.value,
        password: form.password.value
      });

      if (data.success && data.data) {
        auth.setToken(data.data.token);
        auth.setUser(data.data.user);
        const role = data.data.user.role;
        if (role === 'admin') location.href = 'admin/dashboard.html';
        else location.href = 'staff/dashboard.html';
      } else {
        alert(data.message || 'Login failed');
      }

      btn.disabled = false;
      btn.textContent = 'LOGIN';
    };

    document.getElementById('forgotLink').onclick = async (e) => {
      e.preventDefault();
      const email = prompt('Enter your email to reset password:');
      if (!email) return;
      const res = await api.post('/auth/forgot-password', { email });
      alert(res.message || (res.success ? 'Email sent' : 'Failed'));
    };
  </script>
</body>

</html>
