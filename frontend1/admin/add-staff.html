<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Staff - Admin</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="dash-page">
  <header class="dash-header">
    <div class="logo-area">
      <div class="logo-icon">🛡</div><span class="logo-text">Admin Dashboard</span>
    </div>
    <div class="header-links">
      <a href="categories.html">Manage Categories</a>
      <a href="departments.html">Departments</a>
      <a href="settings.html">Settings</a>
      <span class="user-name">-</span>
    </div>
  </header>

  <div class="dash-body">
    <aside class="sidebar">
      <div class="sidebar-user">
        <div class="user-pill">
          <div class="user-avatar" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.3)">
          </div>
          <div class="user-info">
            <div class="user-name">-</div>
            <div class="user-role">Admin</div>
          </div>
        </div>
      </div>
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-link">🏠 Dashboard</a>
        <a href="manage-complaints.html" class="nav-link">📋 All Complaints</a>
        <a href="unassigned-complaints.html" class="nav-link">📌 Unassigned</a>
        <a href="staff.html" class="nav-link active">👥 Staff Management</a>
        <a href="reports.html" class="nav-link">📊 Reports</a>
        <a href="settings.html" class="nav-link">⚙ Settings</a>
        <a href="#" class="nav-link logout">🚪 Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="breadcrumb">Staff Management › Add Staff</div>
      <a href="staff.html" style="float:right;color:var(--primary-light)">Back to List ›</a>
      <h1 class="page-title">Add Staff</h1>

      <div class="content-card" style="max-width:500px">
        <form id="staffForm">
          <div class="form-group"><label>Full Name</label><input type="text" name="name" class="input" required></div>
          <div class="form-group"><label>Email</label><input type="email" name="email" class="input" required></div>
          <div class="form-group"><label>Password</label><input type="password" name="password" class="input" required
              id="pwField"></div>
          <div class="form-group"><label>Phone</label><input type="tel" name="phone" class="input" placeholder="+91 ">
          </div>
          <div class="form-group"><label>Role</label><select name="role" class="input">
              <option value="staff">Staff</option>
              <option value="admin">Admin</option>
            </select></div>
          <div class="form-group"><label>Department</label><select name="department_id" class="input" id="deptSelect">
              <option value="">Select</option>
            </select></div>
          <div class="form-group" id="statusGrp" style="display:none">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
              <input type="checkbox" name="is_active" checked> <span>Active Account</span>
            </label>
          </div>
          <button type="submit" class="btn btn-primary">SAVE STAFF</button>
        </form>
      </div>
    </main>
  </div>

  <footer class="footer"><span>SafeCity</span><span>CivicWorks</span><span>QuickFix</span><span>GovSolve</span></footer>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    renderLayout({ role: 'admin', page: 'staff' });
    const editId = new URLSearchParams(location.search).get('edit');

    api.get('/departments').then(r => {
      if (r.success && r.data) {
        document.getElementById('deptSelect').innerHTML = '<option value="">Select</option>' + r.data.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
      }
    });

    if (editId) {
      document.querySelector('.page-title').textContent = 'Edit Staff';
      document.getElementById('pwField').closest('.form-group').style.display = 'none';
      document.getElementById('statusGrp').style.display = 'block';

      api.get('/admin/staff').then(r => {
        const list = r.success && r.data ? r.data : [];
        const s = list.find(x => x.id === editId);
        if (s) {
          document.querySelector('[name=name]').value = s.name;
          document.querySelector('[name=email]').value = s.email;
          document.querySelector('[name=email]').readOnly = true;
          document.querySelector('[name=role]').value = s.role || 'staff';
          document.getElementById('deptSelect').value = s.department_id || '';
          document.querySelector('[name=phone]').value = s.phone || '';
          document.querySelector('[name=is_active]').checked = !!s.is_active;
        }
      });
    }

    document.getElementById('staffForm').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const baseData = {
        name: form.name.value,
        phone: form.phone.value,
        role: form.role.value,
        department_id: form.department_id.value || null,
        is_active: form.is_active.checked
      };

      if (editId) {
        const r = await api.put('/admin/staff/' + editId, baseData);
        if (r.success) { alert('Staff updated'); location.href = 'staff.html'; } else alert(r.message);
      } else {
        if (!form.password.value) { alert('Password required'); return; }
        const r = await api.post('/admin/staff', {
          ...baseData,
          email: form.email.value,
          password: form.password.value
        });
        if (r.success) { alert('Staff created'); location.href = 'staff.html'; } else alert(r.message);
      }
    };
  </script>
</body>

</html>
