<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unassigned Complaints - Admin</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="dash-page">
  <header class="dash-header">
    <div class="logo-area"><div class="logo-icon">🛡</div><span class="logo-text">Admin Dashboard</span></div>
    <div class="header-links">
      <a href="categories.html">Manage Categories</a>
      <a href="departments.html">Departments</a>
      <a href="settings.html">Settings</a>
      <span class="user-name">-</span>
    </div>
  </header>

  <div class="dash-body">
    <aside class="sidebar">
      <div class="sidebar-user"><div class="user-pill"><div class="user-avatar" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.3)"></div><div class="user-info"><div class="user-name">-</div><div class="user-role">Admin</div></div></div></div>
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-link">🏠 Dashboard</a>
        <a href="manage-complaints.html" class="nav-link">📋 All Complaints</a>
        <a href="unassigned-complaints.html" class="nav-link active">📌 Unassigned Complaints</a>
        <a href="staff.html" class="nav-link">👥 Staff Management</a>
        <a href="reports.html" class="nav-link">📊 Reports</a>
        <a href="settings.html" class="nav-link">⚙ Settings</a>
        <a href="#" class="nav-link logout">🚪 Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="breadcrumb">Admin Dashboard › Unassigned Complaints</div>
      <h1 class="page-title">Unassigned Complaints</h1>

      <div class="content-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Token</th><th>Category</th><th>Location</th><th>Date</th><th>Assign</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <footer class="footer"><span>SafeCity</span><span>CivicWorks</span><span>QuickFix</span><span>GovSolve</span></footer>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    renderLayout({ role: 'admin', page: 'unassigned-complaints' });

    const load = async () => {
      const r = await api.get('/admin/unassigned-complaints');
      const list = r.success && r.data ? r.data : [];
      const staffRes = await api.get('/admin/staff');
      const staff = staffRes.success && staffRes.data ? staffRes.data.filter(s => s.role !== 'admin') : [];

      document.getElementById('tableBody').innerHTML = list.map(c => {
        const cat = (c.categories && c.categories.name) || '-';
        const assignOpts = staff.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        return `<tr>
          <td><a href="complaint-detail.html?id=${c.id}">${c.token || c.id}</a></td>
          <td>${cat}</td><td>${c.location || '-'}</td>
          <td>${c.created_at ? new Date(c.created_at).toLocaleString() : '-'}</td>
          <td><select class="assign-select" data-id="${c.id}" style="padding:6px;margin-right:8px"><option value="">Select</option>${staff.map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('')}</select><button class="btn btn-primary doAssign" data-id="${c.id}" style="padding:6px 12px">Assign</button></td>
        </tr>`;
      }).join('') || '<tr><td colspan="5">No unassigned complaints</td></tr>';

      document.querySelectorAll('.doAssign').forEach(btn => {
        btn.onclick = async () => {
          const cid = btn.dataset.id;
          const row = btn.closest('tr');
          const sel = row.querySelector('.assign-select');
          const sid = sel.value;
          if (!sid) return;
          const r = await api.put('/admin/assign/' + cid, { assigned_staff_id: sid });
          if (r.success) load();
          else alert(r.message);
        };
      });
    };
    load();
  </script>
</body>
</html>
