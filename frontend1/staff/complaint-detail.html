<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Detail - Staff</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="dash-page">
  <header class="dash-header">
    <div class="logo-area"><div class="logo-icon">👷</div><span class="logo-text">Staff Dashboard</span></div>
    <div class="header-links"><span class="user-name">-</span></div>
  </header>

  <div class="dash-body">
    <aside class="sidebar">
      <div class="sidebar-user"><div class="user-pill"><div class="user-avatar" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.3)"></div><div class="user-info"><div class="user-name">-</div><div class="user-role">Staff</div></div></div></div>
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-link">🏠 Dashboard</a>
        <a href="my-complaints.html" class="nav-link active">📋 My Complaints</a>
        <a href="profile.html" class="nav-link">👤 Profile</a>
        <a href="settings.html" class="nav-link">⚙ Settings</a>
        <a href="#" class="nav-link logout">🚪 Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="breadcrumb">Staff Dashboard › My Complaints › Detail</div>
      <h1 class="page-title">Complaint Detail</h1>

      <div style="display:grid;grid-template-columns:1fr 300px;gap:24px">
        <div>
          <div class="content-card">
            <h3><span id="complaintToken">-</span> <span class="badge badge-pending" id="statusBadge">-</span></h3>
            <p><strong id="complaintTitle">-</strong></p>
            <p id="complaintDesc" style="margin:12px 0"></p>
            <p>Location: <span id="complaintLoc">-</span></p>
            <p>Submitted: <span id="complaintDate">-</span></p>
            <div id="imageArea" style="margin-top:16px"></div>
          </div>
          <div class="content-card">
            <h3>Timeline</h3>
            <div id="timeline"></div>
          </div>
        </div>
        <div>
          <div class="content-card">
            <h3>Change Status</h3>
            <select id="statusSelect" class="input"><option value="assigned">Assigned</option><option value="in_progress">In Progress</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select>
            <input type="text" id="noteInput" class="input" placeholder="Note (optional)" style="margin-top:12px">
            <button class="btn btn-primary" id="btnStatus" style="width:100%;margin-top:12px">Update Status</button>
          </div>
          <div class="content-card">
            <h3>Upload Proof</h3>
            <input type="file" id="proofFile" class="input" accept="image/*,.pdf" style="margin-bottom:8px">
            <button class="btn btn-primary" id="btnUpload" style="width:100%">Upload</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer class="footer"><span>SafeCity</span><span>CivicWorks</span><span>QuickFix</span><span>GovSolve</span></footer>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    renderLayout({ role: 'staff', page: 'my-complaints' });
    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = 'my-complaints.html';

    const load = async () => {
      const r = await api.get('/staff/complaint/' + id);
      if (!r.success) { alert('Not found'); location.href = 'my-complaints.html'; return; }
      const c = r.data;
      document.getElementById('complaintToken').textContent = c.token || c.id;
      document.getElementById('statusBadge').textContent = c.status || '-';
      document.getElementById('statusBadge').className = 'badge badge-' + (c.status || 'pending').replace('_','-');
      document.getElementById('complaintTitle').textContent = c.title || '-';
      document.getElementById('complaintDesc').textContent = c.description || '-';
      document.getElementById('complaintLoc').textContent = c.location || '-';
      document.getElementById('complaintDate').textContent = c.created_at ? new Date(c.created_at).toLocaleString() : '-';
      document.getElementById('statusSelect').value = c.status || 'assigned';

      if (c.image_url) document.getElementById('imageArea').innerHTML = `<img src="${c.image_url}" style="max-width:100%;max-height:200px;border-radius:8px">`;
      const files = c.files || [];
      if (files.length) document.getElementById('imageArea').innerHTML += files.map(f => `<div><a href="${f.file_url}" target="_blank">View proof</a></div>`).join('');

      const tl = c.timeline || [];
      document.getElementById('timeline').innerHTML = tl.map(t => `
        <div style="padding:8px 0;border-bottom:1px solid var(--border)">
          <strong>${t.status}</strong>: ${t.note || ''}<br><small>${t.created_at ? new Date(t.created_at).toLocaleString() : ''}</small>
        </div>
      `).join('') || '<p style="color:var(--text-muted)">No timeline</p>';
    };

    document.getElementById('btnStatus').onclick = async () => {
      const st = document.getElementById('statusSelect').value;
      const note = document.getElementById('noteInput').value.trim();
      const r = await api.put('/staff/status/' + id, { status: st, note: note || undefined });
      if (r.success) { document.getElementById('noteInput').value = ''; load(); } else alert(r.message);
    };

    document.getElementById('btnUpload').onclick = async () => {
      const file = document.getElementById('proofFile').files[0];
      if (!file) { alert('Select a file'); return; }
      const fd = new FormData();
      fd.append('file', file);
      fd.append('complaint_id', id);
      const r = await api.post('/staff/upload-proof', fd, true);
      if (r.success) { document.getElementById('proofFile').value = ''; load(); } else alert(r.message);
    };

    load();
  </script>
</body>
</html>
