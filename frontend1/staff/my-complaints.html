<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Complaints - Staff</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="dash-page">
  <header class="dash-header">
    <div class="logo-area"><div class="logo-icon">👷</div><span class="logo-text">Staff Dashboard</span></div>
    <div class="header-links"><span class="user-name">-</span></div>
  </header>

  <div class="dash-body">
    <aside class="sidebar">
      <div class="sidebar-user"><div class="user-pill"><div class="user-avatar" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.3)"></div><div class="user-info"><div class="user-name">-</div><div class="user-role">Staff</div></div></div></div>
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-link">🏠 Dashboard</a>
        <a href="my-complaints.html" class="nav-link active">📋 My Complaints</a>
        <a href="profile.html" class="nav-link">👤 Profile</a>
        <a href="settings.html" class="nav-link">⚙ Settings</a>
        <a href="#" class="nav-link logout">🚪 Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="breadcrumb">Staff Dashboard › My Complaints</div>
      <h1 class="page-title">My Complaints</h1>

      <div class="content-card">
        <div class="filters-row">
          <input type="text" id="search" placeholder="Search..." style="max-width:200px">
          <button class="btn btn-primary" id="btnSearch">🔍 Search</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Token</th><th>Category</th><th>Location</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <footer class="footer"><span>SafeCity</span><span>CivicWorks</span><span>QuickFix</span><span>GovSolve</span></footer>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    renderLayout({ role: 'staff', page: 'my-complaints' });

    const load = async () => {
      const r = await api.get('/staff/complaints');
      const list = r.success && r.data ? r.data : [];
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = q ? list.filter(c => ((c.token||'')+ (c.location||'') + ((c.categories&&c.categories.name)||'')).toLowerCase().includes(q)) : list;
      const statusCls = s => 'badge badge-' + (s || 'pending').replace('_','-');
      document.getElementById('tableBody').innerHTML = filtered.map(c => `
        <tr><td><a href="complaint-detail.html?id=${c.id}">${c.token || c.id}</a></td>
        <td>${(c.categories && c.categories.name) || '-'}</td><td>${c.location || '-'}</td>
        <td>${c.created_at ? new Date(c.created_at).toLocaleString() : '-'}</td>
        <td><span class="${statusCls(c.status)}">${c.status || '-'}</span></td></tr>
      `).join('') || '<tr><td colspan="5">No complaints</td></tr>';
    };
    document.getElementById('btnSearch').onclick = load;
    load();
  </script>
</body>
</html>
